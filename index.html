<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MCAS Medieval Science Maze Quest</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Georgia;
}

/* GAME AREA */

#gameWorld{
    width:1600px;
    height:900px;
    position:relative;
    background:#3b5d2a;
    overflow:hidden;
}

/* HUD */

#hud{
    position:fixed;
    top:10px;
    left:10px;

    z-index:9999;

    background:rgba(0,0,0,.7);

    color:white;

    padding:12px;

    border-radius:10px;

    font-size:20px;
}

/* HERO */

#hero{
    width:45px;
    height:45px;

    position:absolute;

    left:40px;
    top:40px;

    background:gold;

    border:3px solid white;

    border-radius:8px;

    animation:bounce .4s infinite;
}

@keyframes bounce{
    0%{transform:translateY(0);}
    50%{transform:translateY(-4px);}
    100%{transform:translateY(0);}
}

/* WALLS */

.wall{
    position:absolute;
    background:#222;
}

/* ENEMIES */

.enemy{
    position:absolute;

    width:50px;
    height:50px;

    font-size:45px;

    text-align:center;
    line-height:50px;

    animation:float 1s infinite;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-6px);}
    100%{transform:translateY(0);}
}

/* BOSS */

#boss{
    position:absolute;

    width:100px;
    height:100px;

    font-size:90px;

    text-align:center;
    line-height:100px;

    display:none;

    animation:bossFloat 1s infinite;
}

@keyframes bossFloat{
    0%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
    100%{transform:translateY(0);}
}

/* TREASURE */

#treasure{
    position:absolute;

    font-size:90px;

    display:none;
}

/* QUESTION BOX */

#dialogueBox{
    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    background:white;

    width:500px;

    padding:20px;

    border-radius:15px;

    display:none;

    z-index:99999;
}

.choiceBtn{
    width:100%;
    padding:12px;
    margin:10px 0;
    cursor:pointer;
}

#message{
    position:fixed;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    background:rgba(0,0,0,.7);

    color:white;

    padding:10px 20px;

    border-radius:10px;

    font-size:22px;
}

</style>
</head>

<body>

<!-- SOUNDS -->

<audio id="correctSound">
<source src="https://actions.google.com/sounds/v1/cartoon/pop.ogg">
</audio>

<audio id="wrongSound">
<source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg">
</audio>

<audio id="bossSound">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<!-- HUD -->

<div id="hud">

<div>❤️ Health: <span id="health">100</span></div>

<div>⭐ Score: <span id="score">0</span></div>

<div>🏰 Level: <span id="level">1</span></div>

<div>❓ Questions: <span id="questionsAnswered">0</span>/10</div>

</div>

<!-- WORLD -->

<div id="gameWorld">

<div id="hero"></div>

<div id="boss">👹</div>

<div id="treasure">💎</div>

</div>

<!-- QUESTIONS -->

<div id="dialogueBox">

<h2 id="questionText"></h2>

<div id="choices"></div>

<button onclick="closeDialogue()">Close</button>

</div>

<div id="message"></div>

<script>

/* LEVEL DATA */

const levels = [

{
mazeColor:"#3b5d2a",
boss:"🐉",

enemies:[
{x:250,y:150,sprite:"🧙"},
{x:500,y:300,sprite:"👺"},
{x:700,y:120,sprite:"💀"},
{x:900,y:400,sprite:"🕷️"},
{x:1150,y:250,sprite:"👻"}
],

walls:[
{x:150,y:0,w:20,h:600},
{x:350,y:300,w:20,h:600},
{x:600,y:0,w:20,h:500},
{x:850,y:300,w:20,h:600},
{x:1100,y:0,w:20,h:500}
]
},

{
mazeColor:"#5a3d1f",
boss:"🪨",

enemies:[
{x:200,y:100,sprite:"👹"},
{x:450,y:250,sprite:"☠️"},
{x:750,y:500,sprite:"🧟"},
{x:1050,y:350,sprite:"🦂"},
{x:1300,y:600,sprite:"🦇"}
],

walls:[
{x:250,y:0,w:20,h:700},
{x:500,y:200,w:20,h:700},
{x:800,y:0,w:20,h:600},
{x:1100,y:200,w:20,h:700}
]
},

{
mazeColor:"#1f355a",
boss:"👿",

enemies:[
{x:300,y:200,sprite:"🧛"},
{x:600,y:450,sprite:"🧌"},
{x:850,y:100,sprite:"🐍"},
{x:1100,y:500,sprite:"🕸️"},
{x:1350,y:250,sprite:"🦹"}
],

walls:[
{x:150,y:0,w:20,h:800},
{x:450,y:150,w:20,h:800},
{x:750,y:0,w:20,h:800},
{x:1050,y:150,w:20,h:800}
]
},

{
mazeColor:"#4d1f5a",
boss:"😈",

enemies:[
{x:250,y:100,sprite:"👾"},
{x:500,y:250,sprite:"🤖"},
{x:800,y:450,sprite:"🧠"},
{x:1100,y:200,sprite:"⚡"},
{x:1350,y:600,sprite:"☣️"}
],

walls:[
{x:200,y:0,w:20,h:900},
{x:500,y:100,w:20,h:900},
{x:800,y:0,w:20,h:900},
{x:1100,y:100,w:20,h:900}
]
}

];

/* QUESTIONS */

const questionsByLevel = {

1:[
{
question:"What type of energy does a moving object have?",
choices:["Thermal","Kinetic","Potential","Chemical"],
answer:"Kinetic"
},
{
question:"What force keeps us on Earth?",
choices:["Magnetism","Gravity","Friction","Electricity"],
answer:"Gravity"
}
],

2:[
{
question:"Which rock forms from cooled lava?",
choices:["Igneous","Sedimentary","Metamorphic","Fossil"],
answer:"Igneous"
},
{
question:"What process changes liquid water into gas?",
choices:["Condensation","Freezing","Evaporation","Melting"],
answer:"Evaporation"
}
],

3:[
{
question:"What controls what enters and exits a cell?",
choices:["Nucleus","Membrane","Ribosome","Cytoplasm"],
answer:"Membrane"
},
{
question:"Which organelle makes energy?",
choices:["Nucleus","Mitochondria","Ribosome","Membrane"],
answer:"Mitochondria"
}
],

4:[
{
question:"Which process makes glucose in plants?",
choices:["Respiration","Photosynthesis","Digestion","Fermentation"],
answer:"Photosynthesis"
},
{
question:"Which particle has a negative charge?",
choices:["Proton","Neutron","Electron","Nucleus"],
answer:"Electron"
}
]

};

/* VARIABLES */

const gameWorld = document.getElementById("gameWorld");

const hero = document.getElementById("hero");

const boss = document.getElementById("boss");

const treasure = document.getElementById("treasure");

const dialogueBox = document.getElementById("dialogueBox");

const questionText = document.getElementById("questionText");

const choicesDiv = document.getElementById("choices");

const message = document.getElementById("message");

const correctSound = document.getElementById("correctSound");

const wrongSound = document.getElementById("wrongSound");

const bossSound = document.getElementById("bossSound");

let heroX = 40;
let heroY = 40;

let health = 100;
let score = 0;

let currentLevel = 1;

let questionsAnswered = 0;

let enemies = [];

let walls = [];

let bossDefeated = false;

/* LOAD LEVEL */

function loadLevel(levelNum){

gameWorld.style.background = levels[levelNum-1].mazeColor;

document.querySelectorAll(".enemy").forEach(e=>e.remove());

document.querySelectorAll(".wall").forEach(w=>w.remove());

enemies = [];
walls = [];

questionsAnswered = 0;

bossDefeated = false;

boss.style.display = "none";

treasure.style.display = "none";

document.getElementById("questionsAnswered").innerText = questionsAnswered;

const level = levels[levelNum-1];

/* CREATE WALLS */

level.walls.forEach(w=>{

const wall = document.createElement("div");

wall.classList.add("wall");

wall.style.left = w.x + "px";
wall.style.top = w.y + "px";
wall.style.width = w.w + "px";
wall.style.height = w.h + "px";

gameWorld.appendChild(wall);

walls.push(wall);

});

/* CREATE ENEMIES */

level.enemies.forEach(enemyData=>{

const enemy = document.createElement("div");

enemy.classList.add("enemy");

enemy.innerHTML = enemyData.sprite;

enemy.style.left = enemyData.x + "px";
enemy.style.top = enemyData.y + "px";

gameWorld.appendChild(enemy);

enemies.push(enemy);

});

/* BOSS */

boss.innerHTML = level.boss;

boss.style.left = "1450px";
boss.style.top = "700px";

/* TREASURE */

treasure.style.left = "1500px";
treasure.style.top = "150px";

heroX = 40;
heroY = 40;

updateHero();

updateHUD();

}

/* HUD */

function updateHUD(){

document.getElementById("health").innerText = health;

document.getElementById("score").innerText = score;

document.getElementById("level").innerText = currentLevel;

document.getElementById("questionsAnswered").innerText = questionsAnswered;

}

/* HERO */

function updateHero(){

hero.style.left = heroX + "px";

hero.style.top = heroY + "px";

}

/* COLLISION */

function collision(a,b){

const aRect = a.getBoundingClientRect();

const bRect = b.getBoundingClientRect();

return !(

aRect.top > bRect.bottom ||
aRect.bottom < bRect.top ||
aRect.right < bRect.left ||
aRect.left > bRect.right

);

}

/* QUESTIONS */

function getQuestion(){

const qList = questionsByLevel[currentLevel];

return qList[Math.floor(Math.random()*qList.length)];

}

function askQuestion(target){

const q = getQuestion();

dialogueBox.style.display = "block";

questionText.innerText = q.question;

choicesDiv.innerHTML = "";

q.choices.forEach(choice=>{

const btn = document.createElement("button");

btn.classList.add("choiceBtn");

btn.innerText = choice;

btn.onclick = ()=>{

if(choice===q.answer){

correctSound.play();

score += 10;

questionsAnswered++;

showMessage("Correct!");

target.remove();

if(questionsAnswered >= 10){

boss.style.display = "block";

showMessage("Boss unlocked!");

}

}else{

wrongSound.play();

health -= 10;

showMessage("Incorrect!");

if(health<=0){

alert("Game Over!");

location.reload();

}

}

updateHUD();

closeDialogue();

};

choicesDiv.appendChild(btn);

});

}

function closeDialogue(){

dialogueBox.style.display = "none";

}

/* MESSAGE */

function showMessage(text){

message.innerText = text;

setTimeout(()=>{

message.innerText = "";

},3000);

}

/* MOVEMENT */

window.addEventListener("keydown",(e)=>{

let speed = 12;

let oldX = heroX;
let oldY = heroY;

if(e.key==="ArrowUp") heroY -= speed;

if(e.key==="ArrowDown") heroY += speed;

if(e.key==="ArrowLeft") heroX -= speed;

if(e.key==="ArrowRight") heroX += speed;

updateHero();

/* WALL COLLISION */

for(let wall of walls){

if(collision(hero,wall)){

heroX = oldX;
heroY = oldY;

updateHero();

}

}

/* ENEMY COLLISION */

enemies.forEach(enemy=>{

if(enemy.style.display !== "none" && collision(hero,enemy)){

askQuestion(enemy);

}

});

/* BOSS */

if(questionsAnswered >= 10 && collision(hero,boss) && !bossDefeated){

bossSound.play();

bossDefeated = true;

boss.style.display = "none";

treasure.style.display = "block";

score += 100;

showMessage("Boss defeated!");

}

/* TREASURE */

if(collision(hero,treasure) && bossDefeated){

if(currentLevel < 4){

currentLevel++;

showMessage("Entering Level " + currentLevel);

loadLevel(currentLevel);

}else{

alert("YOU COMPLETED ALL FOUR SCIENCE MAZES!");

}

}

});

/* START */

loadLevel(1);

</script>

</body>
</html>
